name: CI

on:
  pull_request:
  # Appelé par le workflow CD, qui couvre les poussées sur `main` et les tags : il
  # rejoue ces mêmes tests avant de construire le binaire. Déclencher aussi la CI sur
  # `push: main` ferait tourner la suite deux fois pour rien.
  workflow_call:

# Une PR poussée trois fois de suite n'a pas besoin de trois exécutions : seule la
# dernière compte. Les exécutions appelées par la CD ne sont jamais annulées.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    # Windows : c'est la plateforme cible du binaire, et les tests d'UI ont besoin
    # d'un vrai affichage Tk — que les runners Windows fournissent sans xvfb.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # La version plancher déclarée par `requires-python`, et celle sur laquelle le
        # projet se développe (et sur laquelle la CD compile le binaire). 3.13 au milieu
        # pour ne pas laisser un trou entre les deux.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet et ses dépendances de développement
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lancer les tests
        # Sans argument : `testpaths` (pyproject.toml) couvre `tests/` et `integration_tests/`.
        run: python -m pytest -q
