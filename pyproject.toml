[project]
name = "auto-classes"
version = "0.1.0"
description = "Automatisation de la création de classes d'élèves selon des règles configurables"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    # CTkImage et le recoloriage des pictogrammes reposent sur Pillow, que
    # customtkinter n'exige pas lui-même.
    "pillow>=10.0",
    # Client Pronote non officiel : espaces Élève, Parent et Vie scolaire (pas
    # Professeurs). Épinglé en minorant : l'API des `dataClasses` a déjà bougé.
    "pronotepy>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nuitka>=2.0",
]

[project.scripts]
auto-classes = "auto_classes.cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auto_classes.ui" = ["assets/*.png"]

[tool.pytest.ini_options]
# `pytest` sans argument lance la totalité : tests unitaires et tests d'intégration
# (l'oracle par force brute tient en une trentaine de secondes à froid).
testpaths = ["tests", "integration_tests"]
